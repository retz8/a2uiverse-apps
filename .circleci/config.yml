# The repository's gates on every branch: `pnpm verify` over the catalogs, and each Python project's own tests, in parallel.

version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.23
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  base:
    docker:
      - image: cimg/base:current

jobs:
  verify:
    executor: node
    steps:
      - checkout
      - run:
          name: Enable Corepack
          command: sudo corepack enable
      - run:
          name: Point pnpm at a cacheable store
          command: pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-
      - run:
          name: Install
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Build, typecheck, test, lint, format check
          command: pnpm verify

  pytest:
    executor: base
    steps:
      - checkout
      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run:
          name: Every Python project's tests
          command: |
            failed=0
            for project in agent-kit github/agent gmail/agent calendar/agent circleci/agent linear/agent mocks/shop-a/agent mocks/shop-b/agent; do
              echo "== $project"
              (cd "$project" && ~/.local/bin/uv run --locked pytest) || failed=1
            done
            exit $failed

workflows:
  verify:
    jobs:
      - verify
      - pytest
