[project]
name = "a2ui-shop-a-agent"
version = "0.1.0"
description = "The Shop A app's A2A agent, built on a2ui-agent-kit."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a2ui-agent-kit",
    "a2ui-agent-sdk>=0.2.4,<0.3.0",
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "google-adk>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.40.0",
    "click>=8.1.8",
    "mcp>=1.28.1,<2.0.0",
]

[tool.uv]
package = false

# The mocks live in this repo beside the kit, so they take it as a path dep exactly as
# the vendor apps do. The scaffold's git pin is for apps generated outside the repo; an
# in-repo app on a pinned commit could not exercise a kit change until it was pushed,
# and the mocks are the tier that finds those changes first.
[tool.uv.sources]
a2ui-agent-kit = { path = "../../../agent-kit", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Third-party: starlette's TestClient deprecates its httpx backend. Not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
