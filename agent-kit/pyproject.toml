[project]
name = "a2ui-agent-kit"
version = "0.1.0"
description = "A kit for building A2UI+A2A agents: servers, run modes, recorder, beats, catalog loading, prompt assembly."
requires-python = ">=3.14"
dependencies = [
    "a2ui-agent-sdk>=0.2.4,<0.3.0",
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "google-adk>=2.5.0,<3.0.0",
    "mcp>=1.28.1,<2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.40.0",
    "click>=8.1.8",
    "httpx>=0.27.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "a2ui_agent_kit"

[dependency-groups]
dev = ["pytest>=9.0.0", "pytest-asyncio>=1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
