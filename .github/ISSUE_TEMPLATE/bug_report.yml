name: Bug report
description: An app, the agent kit or the scaffolder doesn't work as its README says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste a token or any other credential into an issue.
  - type: dropdown
    id: app
    attributes:
      label: Where
      options:
        - GitHub
        - Gmail
        - Google Calendar
        - CircleCI
        - Linear
        - A mock store
        - The agent kit
        - create-a2ui-agent
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - deterministic
        - stub
        - live
        - Not an agent
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran, and the request or question the app answered.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python and uv versions, Node version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The agent's terminal output, with any credential removed.
      render: shell
